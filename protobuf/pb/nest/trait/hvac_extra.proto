  bool oob_temp_completed = 5;
  bool oob_test_completed = 6;
  bool oob_summary_completed = 7;
  bool oob_startup_completed = 8;
  google.protobuf.StringValue pro_id = 9;
}

message WiringTrait {
  repeated int32 connections_mechanical = 1;
  repeated int32 connections_electrical = 2;
  int32 pin_c_description = 3;
  int32 pin_g_description = 4;
  int32 pin_ob_description = 5;
  int32 pin_rc_description = 6;
  int32 pin_rh_description = 7;
  int32 pin_star_description = 8;
  int32 pin_w1_description = 9;
  int32 pin_w2_aux_description = 10;
  int32 pin_y1_description = 11;
  int32 pin_y2_description = 12;
  string wiring_error = 13;
  google.protobuf.Timestamp wiring_error_timestamp = 14;
  int32 pin_aqplus_description = 15;
  int32 pin_aqminus_description = 16;
}

message SeasonalSavingsSettingsTrait {
  message SeasonalSavingsStage {}

  string event_guid = 1;
  int32 set_point_type = 2;
  google.protobuf.Timestamp qual_start_time_local = 3;
  google.protobuf.Timestamp qual_stop_time_local = 4;
  uint32 afterglow_seconds = 5;
  uint32 paused_expiration_seconds = 6;
  bool force_ignore_blackout_times = 7;
  map<uint32, SeasonalSavingsStage> stages = 8;
  google.protobuf.StringValue partner_name = 9;
  int32 season = 10;
  string campaign_id = 11;
  string debug_name = 12;
  string rts_state = 13;
  int64 rts_actual_results_stage_index = 14;
  string rts_requested_action = 15;
  string rts_stop_reason = 16;
  string rts_version = 17;
  string rts_type = 18;
}

message SeasonalSavingsTrait {
  string event_guid = 1;
  int32 state = 2;
  int32 stop_reason = 3;
  int32 schedule_mode = 4;
  google.protobuf.Timestamp predicted_completion_time = 5;
  google.protobuf.StringValue partner_name = 6;
  google.protobuf.Timestamp predicted_expiration_time_utc = 7;
}

message LeafTrait {
