  HvacControl.Temperature eco_threshold_heat = 2;
  HvacControl.Temperature eco_threshold_cool = 3;
  HvacControl.Temperature setpoint_threshold_heat = 4;
  HvacControl.Temperature setpoint_threshold_cool = 5;
