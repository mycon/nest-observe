syntax = "proto3";
package nest.trait.hvac;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "nest/trait/hvac.proto";

// ── HvacControl.Temperature ───────────────────────────────────────────────────
// Shared helper used by EcoModeTrait and SetPointScheduleSettingsTrait.
// { float value = 1 }  — Celsius temperature value.
message HvacControl {
  message Temperature {
    float value = 1;  // Celsius
  }

  message TemperatureThreshold {
    Temperature value = 1;
    bool enabled = 2;
  }
}

message SafetyShutoffCapabilitiesTrait {
  bool smoke_shutoff_supported = 1;
  bool compressor_heads_up_supported = 2;
}

message AirwaveTrait {
  bool fan_cooling_active = 1;
  bool fan_cooling_readiness = 2;
}

message AirwaveSettingsTrait {
  bool fan_cooling_enabled = 1;
}

message HeatPumpControlTrait {
  bool heat_pump_ready = 1;
  bool heat_pump_setback_active = 2;
}

enum HeatPumpSavingsMode {
  HEAT_PUMP_SAVINGS_MODE_UNSPECIFIED = 0;
  HEAT_PUMP_SAVINGS_MODE_MAX_SAVINGS = 1;
  HEAT_PUMP_SAVINGS_MODE_BALANCED = 2;
  HEAT_PUMP_SAVINGS_MODE_MAX_COMFORT = 3;
  HEAT_PUMP_SAVINGS_MODE_OFF = 4;
}

message HeatPumpControlSettingsTrait {
  HvacControl.TemperatureThreshold heat_pump_aux_threshold = 1;
  HvacControl.TemperatureThreshold heat_pump_comp_threshold = 2;
  HeatPumpSavingsMode heat_pump_savings_mode = 3;
  google.protobuf.FloatValue aux_min_delta = 4;
  google.protobuf.Duration aux_min_delay = 5;
  google.protobuf.Duration aux_upstage_threshold = 6;
  google.protobuf.Duration dual_fuel_changeover_threshold = 7;
}

enum PreconditioningState {
  PRECONDITIONING_STATE_UNSPECIFIED = 0;
  PRECONDITIONING_STATE_INACTIVE = 1;
  PRECONDITIONING_STATE_ACTIVE = 2;
}

message PreconditioningTrait {
  bool preconditioning_active = 1;
  PreconditioningState state = 2;
}

message PreconditioningSettingsTrait {
  bool preconditioning_enabled = 1;
  google.protobuf.Duration max_nighttime_seconds = 2;
  bool heat_preconditioning_enabled = 3;
  bool cool_preconditioning_enabled = 4;
  bool return_home_preconditioning_enabled = 5;
}

message SafetyShutoffSettingsTrait {
  bool hvac_co_safety_shutoff_enabled = 1;
  bool hvac_smoke_safety_shutoff_enabled = 2;
  bool compressor_heads_up_enabled = 3;
}

enum ScheduleOffsetState {
  SCHEDULE_OFFSET_STATE_UNSPECIFIED = 0;
  SCHEDULE_OFFSET_STATE_INACTIVE = 1;
  SCHEDULE_OFFSET_STATE_ACTIVE = 2;
}

enum ScheduleOffsetReason {
  SCHEDULE_OFFSET_REASON_UNSPECIFIED = 0;
  SCHEDULE_OFFSET_REASON_NONE = 1;
  SCHEDULE_OFFSET_REASON_LEAF = 2;
  SCHEDULE_OFFSET_REASON_SYSTEM = 3;
}

message ScheduleOffsetTrait {
  bool is_feature_supported = 1;
  ScheduleOffsetState state = 2;
  ScheduleOffsetReason reason = 3;
  google.protobuf.Timestamp last_update_time = 4;
}

message ScheduleOffsetSettingsTrait {
  message Offset {
    bytes offset_settings = 1;
    bytes metadata = 2;
    bytes event_metadata = 3;
  }
  Offset cool_offset = 1;
  Offset heat_offset = 2;
}

message ScheduleHoldTrait {
  int32 state = 1;
  int32 reason = 2;
  google.protobuf.Timestamp last_update_time = 3;
}

message FanControlCapabilitiesTrait {
  int32 max_available_speed = 1;
  bool supports_indefinite_timer = 2;
  bool supports_timer_in_off_mode = 3;
  google.protobuf.Duration max_timer_duration = 4;
}

message EquipmentSettingsTrait {
  int32 heat_stage1_delivery = 1;
  int32 heat_stage2_delivery = 2;
  int32 heat_stage3_delivery = 3;
  int32 heat_stage1_source = 4;
  int32 heat_stage2_source = 5;
  int32 heat_stage3_source = 6;
  int32 cooling_stage1_delivery = 7;
  int32 cooling_stage2_delivery = 8;
  int32 cooling_stage3_delivery = 9;
  int32 cooling_stage1_source = 10;
  int32 cooling_stage2_source = 11;
  int32 cooling_stage3_source = 12;
  int32 alt_heat_stage1_delivery = 13;
  int32 alt_heat_stage2_delivery = 14;
  int32 alt_heat_stage1_source = 15;
  int32 alt_heat_stage2_source = 16;
  int32 aux_heat_stage1_delivery = 17;
  int32 aux_heat_stage1_source = 18;
  int32 emergency_heat_delivery = 19;
  int32 emergency_heat_source = 20;
  int32 star_type = 21;
  int32 y2_type = 22;
  int32 dehumidifier_fan_activation = 23;
  int32 dehumidifier_orientation_selected = 24;
  int32 dehumidifier_type = 25;
  int32 humidifier_fan_activation = 26;
  int32 humidifier_type = 27;
  int32 dual_fuel_selected = 28;
  Float_Indirect dual_fuel_breakpoint = 29;
  int32 dual_fuel_breakpoint_override = 30;
  int32 ob_orientation = 31;
  int32 ob_persistence = 32;
  int32 boiler_type = 33;
  Float_Indirect boiler_supply_temperature = 34;
  bool activate_fan_if_heat_source_is_gas = 35;
  int32 ventilator_type = 36;
  bool ventilator_requires_fan_activation = 37;
  int32 aq_wire_type = 38;
  google.protobuf.Duration compressor_min_cycle_time = 39;
