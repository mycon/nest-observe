// Supplemental Nest HVAC protobuf definitions.
// Field numbers verified against SDK JS bundle sdk-421f7ba4a82b319d562a.js.
//
// NOTE: HvacControlTrait, FanControlTrait, EcoModeStateTrait, EcoModeTrait are
