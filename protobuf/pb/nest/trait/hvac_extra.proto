// ── SetPointScheduleSettingsTrait ─────────────────────────────────────────────
// Required by TargetTemperatureSettingsTrait (field 1 references TemperatureSetPoint).
// Field numbers verified against SDK sdk-421f7ba4a82b319d562a.js.
//
// TemperatureSetPoint fields:
//   1 = SetPointScheduleType (enum)
//   2 = DayOfWeek (enum, not decoded)
//   3 = seconds_in_day (uint32)
//   4 = heating_target (HvacControl.Temperature)
//   5 = cooling_target (HvacControl.Temperature)
//   6 = current_actor_info  (HvacActorStruct, not decoded)
//   7 = original_actor_info (HvacActorStruct, not decoded)
message SetPointScheduleSettingsTrait {
  message TemperatureSetPoint {
    SetPointScheduleType    setpoint_type  = 1;
    // DayOfWeek            day_of_week    = 2;  (not decoded)
    uint32                  seconds_in_day = 3;
    HvacControl.Temperature heating_target = 4;
    HvacControl.Temperature cooling_target = 5;
    // HvacActorStruct current_actor_info  = 6;  (not decoded)
    // HvacActorStruct original_actor_info = 7;  (not decoded)
  }

  enum SetPointScheduleType {
    SET_POINT_SCHEDULE_TYPE_UNSPECIFIED = 0;
    SET_POINT_SCHEDULE_TYPE_HEAT        = 1;
    SET_POINT_SCHEDULE_TYPE_COOL        = 2;
    SET_POINT_SCHEDULE_TYPE_RANGE       = 3;
  }

  string name = 1;
  SetPointScheduleType type = 2;
  map<string, TemperatureSetPoint> setpoints_map = 3;
}

// ── TargetTemperatureSettingsTrait ────────────────────────────────────────────
// User-configured target setpoints (independent of eco mode).
// Field numbers verified against SDK sdk-421f7ba4a82b319d562a.js.
//   field 1 = SetPointScheduleSettingsTrait.TemperatureSetPoint
//   field 2 = google.protobuf.BoolValue (enabled)
message TargetTemperatureSettingsTrait {
  SetPointScheduleSettingsTrait.TemperatureSetPoint target_temperature = 1;
  google.protobuf.BoolValue                        enabled            = 2;
}

